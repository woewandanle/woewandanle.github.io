<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#141319">
<title>人文社科學生模擬器</title>
<meta name="description" content="16 歲到大學畢業。理論直覺、實證努力、政治、信心、行政、口才——六種能力，一場人文社會科學的長期抗戰。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#141319; --panel:#1c1b24; --panel2:#262430; --edge:#37334a;
  --paper:#e9e2d1; --dim:#948da6; --brass:#d4a24c; --seal:#c2452f;
  --good:#8fc79f; --bad:#dd7264; --blue:#84a9d6;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --sans:'Noto Sans TC',-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;
  --serif:'Noto Serif TC','Songti TC',serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--paper);font-family:var(--sans);font-size:15px;line-height:1.6;
  background-image:radial-gradient(ellipse 120% 60% at 50% -10%,#2a243866 0%,transparent 60%);}
#app{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
/* ---------- 學籍卡 ---------- */
#board{position:sticky;top:0;z-index:20;background:linear-gradient(#221f2c,#17161d);
  border-bottom:2px solid var(--edge);padding:10px 14px 8px;box-shadow:0 6px 18px #000a}
#bd-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
#bd-name{font-family:var(--serif);font-weight:900;font-size:18px;letter-spacing:.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bd-name small{color:var(--dim);font-family:var(--sans);font-weight:500;font-size:11.5px;margin-left:6px}
#bd-team{color:var(--brass);font-size:12.5px;font-weight:700;letter-spacing:.06em;white-space:nowrap;text-align:right}
#bd-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.bd-cell{background:#100f15;border:1px solid var(--edge);border-radius:5px;padding:4px 6px 3px;text-align:center}
.bd-cell b{display:block;font-family:var(--mono);font-size:17px;font-weight:700;color:var(--brass);
  text-shadow:0 0 8px #d4a24c44;line-height:1.2}
.bd-cell span{font-size:10px;color:var(--dim);letter-spacing:.15em}
#lamps{display:flex;gap:14px;justify-content:center;margin-top:7px}
.lamp{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--dim);letter-spacing:.12em}
.lamp i{width:9px;height:9px;border-radius:1px;background:#2a2636;border:1px solid #40395a;display:inline-block}
.lamp.on{color:var(--paper)} .lamp.on i{background:var(--seal);box-shadow:0 0 8px var(--seal);border-color:var(--seal)}
/* ---------- 紀錄 ---------- */
#bd-mh{display:flex;gap:5px;justify-content:center;margin-top:6px;flex-wrap:wrap}
.mh{font-size:10.5px;padding:1px 8px;border-radius:99px;border:1px solid;letter-spacing:.06em;font-weight:700}
.mh.dep{color:#8fa4d6;border-color:#8fa4d6;background:#8fa4d612}
.mh.adhd{color:#d6a84f;border-color:#d6a84f;background:#d6a84f12}
.mh.bip{color:#c77fd0;border-color:#c77fd0;background:#c77fd012}
.mh.str{color:var(--dim);border-color:var(--edge)}
.mh.rel{color:#dd8fa4;border-color:#dd8fa4;background:#dd8fa412}
#log{flex:1;padding:14px 14px 20px;display:flex;flex-direction:column;gap:10px}
.card{background:var(--panel);border:1px solid var(--edge);border-radius:8px;padding:12px 14px;
  animation:pop .25s ease;overflow-wrap:anywhere}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card h4{font-family:var(--serif);font-size:13px;letter-spacing:.18em;color:var(--paper);font-weight:600;margin-bottom:6px;
  display:flex;align-items:center;gap:8px}
.card h4::before{content:'';width:9px;height:9px;background:var(--seal);border-radius:1px;flex:none}
.card.gold h4::before{background:var(--brass)} .card.bad h4::before{background:var(--bad)}
.card.good h4::before{background:var(--good)} .card.info h4::before{background:var(--blue)}
.card p{font-size:14px} .card p+p{margin-top:4px}
.up{color:var(--good);font-weight:700}.dn{color:var(--bad);font-weight:700}.hl{color:var(--brass);font-weight:700}
.statline{font-family:var(--mono);font-size:12.5px;color:var(--paper);background:#100f15;border:1px dashed var(--edge);
  border-radius:5px;padding:6px 8px;margin-top:6px;line-height:1.8}
.trait{display:inline-block;font-size:12px;padding:1px 8px;border-radius:3px;
  background:#100f15;border:1px solid var(--brass);color:var(--brass);margin:3px 4px 0 0;font-weight:700}
.yr-head{text-align:center;color:var(--dim);font-size:11px;letter-spacing:.3em;padding:8px 0 0;cursor:pointer;user-select:none;font-family:var(--mono)}
.yr-head:hover{color:var(--brass)}
.yr-block.collapsed .yr-body{display:none}
.yr-block.collapsed .yr-head::after{content:' ▸'}
.yr-block:not(.collapsed) .yr-head.has-body::after{content:' ▾'}
/* ---------- 操作區 ---------- */
#act{position:sticky;bottom:0;z-index:20;background:linear-gradient(#17161dee,#141319);border-top:2px solid var(--edge);
  padding:12px 14px calc(12px + env(safe-area-inset-bottom));backdrop-filter:blur(6px)}
#act .title{font-size:12px;letter-spacing:.18em;color:var(--dim);margin-bottom:8px;font-weight:700}
.btn{display:block;width:100%;background:var(--panel2);border:1px solid var(--edge);color:var(--paper);
  font-family:var(--sans);font-size:15px;font-weight:700;border-radius:7px;padding:11px 14px;margin-top:8px;
  cursor:pointer;text-align:left;transition:.15s}
.btn:active{transform:scale(.98)} .btn:hover{border-color:var(--brass)}
.btn:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.btn small{display:block;font-weight:400;font-size:12px;color:var(--dim);margin-top:2px}
.btn.main{background:linear-gradient(#3a3050,#292139);border-color:#544470;text-align:center}
.btn.warn{border-color:#6a3c3c}
.btn:disabled{opacity:.35;cursor:default}
/* 稿紙格骰 */
#dice{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.die{width:44px;height:44px;background:var(--paper);color:#17151c;font-family:var(--mono);
  font-size:22px;font-weight:700;display:flex;align-items:center;justify-content:center;
  border:1.5px solid #c2452f99;position:relative;box-shadow:0 2px 0 #0006}
.die::before{content:'';position:absolute;inset:0;pointer-events:none;background:
  linear-gradient(to right,transparent calc(50% - .5px),#c2452f30 calc(50% - .5px),#c2452f30 calc(50% + .5px),transparent calc(50% + .5px)),
  linear-gradient(to bottom,transparent calc(50% - .5px),#c2452f30 calc(50% - .5px),#c2452f30 calc(50% + .5px),transparent calc(50% + .5px));}
.die.used{opacity:.2;transform:scale(.9)} .die.active{outline:3px solid var(--brass);outline-offset:2px}
.die.six{color:var(--seal)}
.abrow{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--edge);
  border-radius:6px;padding:7px 10px;margin-top:6px;cursor:pointer;user-select:none}
.abrow:active{background:var(--panel2)}
.abrow .nm{width:80px;font-size:13.5px;font-weight:700;flex:none}
.abrow .bar{flex:1;height:8px;background:#100f15;border-radius:2px;overflow:hidden;position:relative}
.abrow .bar i{display:block;height:100%;background:linear-gradient(90deg,#544470,var(--brass));transition:.2s}
.abrow .bar em{position:absolute;top:-2px;bottom:-2px;width:2px;background:#d4a24c88}
.abrow .val{font-family:var(--mono);width:60px;text-align:right;font-size:14px;flex:none;line-height:1.15}
.abrow .val b{color:var(--good)}
.abrow.capped,.abrow.locked{opacity:.4;cursor:default}
#act .row2{display:flex;gap:8px}#act .row2 .btn{flex:1;text-align:center}
/* 開場 */
#start{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;
  background-image:radial-gradient(ellipse 120% 50% at 50% -5%,#33294acc,transparent 60%)}
#start .wrap{max-width:560px;margin:0 auto;padding:36px 22px 60px}
#seal{width:56px;height:56px;border:2.5px solid var(--seal);border-radius:2px;display:flex;align-items:center;
  justify-content:center;font-family:var(--serif);font-weight:900;font-size:15px;color:var(--seal);
  letter-spacing:2px;line-height:1.05;text-align:center;transform:rotate(-3deg)}
#start h1{font-family:var(--serif);font-size:33px;font-weight:900;letter-spacing:.06em;line-height:1.3;margin-top:16px}
#start h1 em{font-style:normal;color:var(--brass)}
#start .sub{color:var(--dim);margin:10px 0 8px;font-size:13.5px;letter-spacing:.06em}
#start .ver{color:var(--seal);font-size:12px;letter-spacing:.1em;margin-bottom:20px}
.field{margin-top:18px}
.field label{display:block;font-size:12px;letter-spacing:.22em;color:var(--dim);font-weight:700;margin-bottom:8px}
.field input{width:100%;background:var(--panel);border:1px solid var(--edge);border-radius:6px;color:var(--paper);
  font-family:var(--sans);font-size:16px;padding:11px 14px;outline:none}
.field input:focus{border-color:var(--brass)}
.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.seg button{background:var(--panel);border:1px solid var(--edge);border-radius:6px;color:var(--dim);
  font-family:var(--sans);font-size:14.5px;font-weight:700;padding:10px 8px;cursor:pointer;text-align:left}
.seg button small{display:block;font-weight:400;font-size:11px;color:#7d7590;margin-top:2px;line-height:1.45}
.seg button.on{background:var(--panel2);color:var(--brass);border-color:var(--brass)}
.seg button.on small{color:#a99a7e}
.yrbtn{width:46px;flex:none;background:var(--panel);border:1px solid var(--edge);color:var(--paper);
  font-size:20px;line-height:1;border-radius:6px;padding:10px 0;cursor:pointer}
.yrbtn:active{background:var(--panel2)}
#odds{display:flex;flex-direction:column;gap:5px}
.odd{display:flex;align-items:center;gap:8px;font-size:13px}
.odd .on{width:76px;flex:none;font-weight:700}
.odd .ob{flex:1;height:9px;background:#100f15;border:1px solid var(--edge);position:relative}
.odd .ob i{display:block;height:100%;background:var(--seal);opacity:.75}
.odd .op{width:38px;text-align:right;font-family:var(--mono);font-size:12px;color:var(--dim);flex:none}
.oddsnote{font-size:11.5px;color:var(--dim);margin-top:8px;letter-spacing:.04em}
.oddsnote a{color:var(--blue);margin-left:6px}
.seedline{font-family:var(--mono);font-size:12px;color:var(--dim);margin-top:22px;line-height:1.8}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#btn-restart{background:none;border:1px solid var(--edge);color:var(--dim);border-radius:5px;
 font-size:14px;line-height:1;padding:4px 8px;margin-left:8px;cursor:pointer;flex:none}
#act-toggle{display:block;margin:0 auto -4px;background:#100f15;border:1px solid var(--edge);
 border-bottom:none;color:var(--dim);font-size:11px;padding:3px 14px;border-radius:7px 7px 0 0;cursor:pointer}
#act.collapsed{display:none!important}
</style>
</head>
<body>
<div id="start">
  <div class="wrap">
    <div id="seal">人文<br>社科</div>
    <h1>人文社科<br><em>學生模擬器</em></h1>
    <p class="sub">理論直覺・實證努力・政治・信心・行政・口才。<br>六種能力，決定你在學術生態鏈的位置。</p>
    <p class="ver">▎本版本：16 歲 → 22 歲（大學畢業）</p>
    <div class="field"><label>姓名</label><input id="in-name" maxlength="10" placeholder="例如：陳彥廷"></div>
    <div class="field"><label>起始年份（十六歲那年）</label>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="yrbtn" id="yr-dn">−</button>
        <input id="in-year" type="number" inputmode="numeric" style="text-align:center">
        <button class="yrbtn" id="yr-up">＋</button>
      </div>
      <p class="oddsnote" id="yr-note"></p>
    </div>
    <div class="field"><label>出身　命運分配表</label>
      <div id="odds"></div>
      <p class="oddsnote">出身由命運抽選，按下開始才會揭曉。<a href="#" id="force-toggle">指定出身</a></p>
      <div class="seg" id="seg-org" style="display:none"></div>
    </div>
    <button class="btn main" style="margin-top:26px" id="btn-start">開始人生 ▸ 十六歲的夏天</button>
    <p class="seedline">命運種子
      <input id="seed-show" maxlength="24" style="width:110px;background:#100f15;color:var(--brass);border:1px solid var(--edge);border-radius:4px;padding:2px 6px;font-family:inherit;font-size:12px;text-align:center">
      · <a href="#" id="seed-re" style="color:var(--blue)">換一個</a><br>相同種子＋相同選擇＝相同人生</p>
  </div>
</div>
<div id="app">
  <header id="board" style="display:none">
    <div id="bd-top"><div id="bd-name"></div><div id="bd-team"></div><button id="btn-restart" title="重新開始">↺</button></div>
    <div id="bd-grid">
      <div class="bd-cell"><b id="bd-age">16</b><span>年齡</span></div>
      <div class="bd-cell"><b id="bd-year">2026</b><span>年份</span></div>
      <div class="bd-cell"><b id="bd-ovr">30</b><span>綜合</span></div>
      <div class="bd-cell"><b id="bd-rep">0</b><span>聲望</span></div>
    </div>
    <div id="lamps">
      <span class="lamp" id="lp0"><i></i>年初進修</span>
      <span class="lamp" id="lp1"><i></i>年度事件</span>
      <span class="lamp" id="lp2"><i></i>年末結算</span>
    </div>
    <div id="bd-mh"></div>
  </header>
  <main id="log"></main>
  <button id="act-toggle" style="display:none">⌄ 收合選項</button>
  <footer id="act" style="display:none"></footer>
</div>
<script>
/* ================= 錯誤可見化 ================= */
function showFatal(err){
  const box=document.createElement('div');
  box.style.cssText='position:fixed;left:10px;right:10px;bottom:10px;z-index:999;background:#2a1416;border:1px solid #dd7264;'+
    'color:#ffdad4;font:12px/1.6 monospace;padding:10px 12px;border-radius:8px;white-space:pre-wrap;max-height:45vh;overflow:auto';
  box.textContent='執行錯誤（請把這段訊息回報）\n'+(err&&(err.stack||err.message)||err);
  document.body.appendChild(box);
}
window.addEventListener('error',e=>showFatal(e.error||e.message));

/* ================= RNG（種子化） ================= */
let SEED = new URLSearchParams(location.search).get('seed') || Math.random().toString(36).slice(2,10);
let _s = 0;
function seedInit(str){ _s = 1779033703; for(let i=0;i<str.length;i++){ _s = Math.imul(_s ^ str.charCodeAt(i), 3432918353); _s = _s<<13 | _s>>>19; } }
function R(){ _s|=0; _s = _s + 0x6D2B79F5 |0; let t = Math.imul(_s ^ _s>>>15, 1|_s); t = t + Math.imul(t ^ t>>>7, 61|t) ^ t; return ((t ^ t>>>14)>>>0)/4294967296; }
const ri=(a,b)=>a+Math.floor(R()*(b-a+1));
const pick=a=>a[Math.floor(R()*a.length)];
const chance=p=>R()*100<p;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const $=id=>document.getElementById(id);
function scrollBottom(){ requestAnimationFrame(()=>window.scrollTo(0,document.body.scrollHeight)); }

/* ================= 能力定義 ================= */
const KEYS=['th','em','po','cf','ad','sp'];
const ABL={th:'理論直覺',em:'實證努力',po:'政治',cf:'信心',ad:'行政',sp:'口才'};
const AB_MAX=80, BAR=80;

/* 出身：s = 初始值區間、p = 潛力上限區間（未列者採基準）；w = 抽選權重 */
const BASE={s:[20,30],p:[55,65]};
const ORIGINS={
 mid :{n:'都會中產', w:45, d:'沒有多特別的優勢，也沒有多特別的理由。', ab:{}},
 town:{n:'小鎮做題家', w:20, d:'你比誰都會寫考卷，只是沒人問過你在想什麼。',
       ab:{em:{s:[30,40],p:[70,80]}, ad:{p:[70,80]}, th:{p:[42,50]}}},
 prof:{n:'教授世家', w:10, camp:true, d:'你從小就知道學者也是人。',
       ab:{po:{s:[30,40],p:[70,80]}, ad:{s:[30,40],p:[70,80]}, em:{s:[25,35]}}},
 art :{n:'文藝家傳', w:10, d:'這不過是你們家的家常音樂。',
       ab:{th:{s:[30,40],p:[70,80]}, sp:{s:[30,40],p:[70,80]}, cf:{s:[30,40],p:[70,80]}}},
 poor:{n:'偏鄉貧寒', w:10, camp:true, d:'城裡人真會玩，可你不會。',
       ab:{po:{s:[10,15],p:[45,55]}, cf:{s:[10,15],p:[45,55]}}},
 cap :{n:'資本之家', w:5, dice:2, d:'低垂的果實從沒缺過，除了苦工。',
       ab:{em:{p:[38,45]}, cf:{s:[35,45],p:[75,80]}, po:{p:[75,80]}, sp:{p:[75,80]}}},
};
function drawOrigin(){ const tot=Object.values(ORIGINS).reduce((a,o)=>a+o.w,0); let r=R()*tot;
  for(const k of Object.keys(ORIGINS)){ r-=ORIGINS[k].w; if(r<0)return k; } return 'mid'; }

const TIERS={
 emp :{n:'帝大霸權', d:'骰數固定 5–6', dice:()=>ri(5,6), pot:{th:6,po:4}},
 top :{n:'頂大系統', d:'骰數固定 4 以上', dice:()=>{const r=R();return r<0.4?4:r<0.8?5:6;}, pot:{th:3,em:3}},
 nat :{n:'國立大學', d:'一般骰數', dice:()=>{const r=R();return r<0.35?3:r<0.75?4:r<0.95?5:6;}, pot:{}},
 priv:{n:'私校聯盟', d:'骰數不超過 3', dice:()=>ri(2,3), pot:{sp:4,ad:4}},
 intl:{n:'跨國鈔能力', d:'骰數固定 5–6｜政治無法升級', dice:()=>ri(5,6), pot:{sp:4,cf:6}},
};

/* ================= 狀態 ================= */
let S=null, stepQ=[], _curYearBody=null;
const MAX_YEARS=12;
function newState(name,org,year){
  const O=ORIGINS[org], ab={}, pot={};
  KEYS.forEach(k=>{ const m=O.ab[k]||{}, sr=m.s||BASE.s, pr=m.p||BASE.p;
    ab[k]=ri(sr[0],sr[1]);
    pot[k]=Math.max(ab[k]+5, ri(pr[0],pr[1]));
  });
  return {name,org,O,ab,pot,carry:{},traits:{},traitList:[],
    age:16,year:year||new Date().getFullYear(),startYear:year||new Date().getFullYear(),rep:0,six:0,tier:null,lockPo:false,
    stage:'HS',log:[],
    litEntries:0,litWins:0,stress:0,dep:null,mania:null,mhList:[],
    thesis:null,dualMajor:null,dest:null,
    grade:0,lost:0,skipNext:false,lostYear:false,crisis:0,hsGov:false,weakPhd:false,
    rel:null,relLog:[],loveGuaranteed:false,exes:0,loveFails:0};
}
function abCost(k){ const cur=S.ab[k],pk=S.pot[k];
  let c=cur>=70?4:cur>=55?3:cur>=40?2:1; if(cur>=pk)c*=3; return c; }
function addAb(k,v){ const o=S.ab[k]; let cur=o,bud=v+(S.carry[k]||0);
  while(bud>0&&cur<AB_MAX){ let cost=cur>=70?4:cur>=55?3:cur>=40?2:1; if(cur>=S.pot[k])cost*=3;
    if(bud>=cost){bud-=cost;cur++;} else break; }
  S.carry[k]=cur>=AB_MAX?0:bud; S.ab[k]=cur; return cur-o; }
/* 事件加值：不吃成長成本，直接加減 */
function bump(k,v){ const o=S.ab[k]; S.ab[k]=clamp(o+v,1,AB_MAX); return S.ab[k]-o; }
function bumps(list){ /* [['th',6],['po',10]] → 文字 */
  return list.map(([k,v])=>{ const d=bump(k,v);
    if(d===0)return `<span style="opacity:.45">${ABL[k]} ±0${v>0?'（已達上限 '+AB_MAX+'）':''}</span>`;
    return `${ABL[k]} <b class="${d>=0?'up':'dn'}">${d>0?'+':''}${d}</b>`; }).join('　');
}
function trait(key,name,desc,tone){ if(S.traits[key])return; S.traits[key]=true; S.traitList.push(name);
  card(tone||'gold','取得屬性：'+name,desc+`<div style="margin-top:6px"><span class="trait">${name}</span></div>`); }
function ovr(){ const w=[0.30,0.24,0.18,0.13,0.09,0.06];
  const a=KEYS.map(k=>S.ab[k]).sort((x,y)=>y-x);
  return Math.round(a.reduce((s,v,i)=>s+v*w[i],0)); }
function schoolScore(){ const a=S.ab; return a.em*0.5+a.th*0.3+a.sp*0.1+a.cf*0.1; }
function scholarType(){ const a=S.ab;
  const arr=KEYS.map(k=>[k,a[k]]).sort((x,y)=>y[1]-x[1]);
  if(arr[0][1]<34)return '尚未定型';
  if(arr[0][1]-arr[1][1]<=3&&arr[0][1]>=52)return '六邊形戰士';
  return {th:'理論怪物',em:'田野工作者',po:'學術政治家',cf:'無畏發言者',ad:'行政大師',sp:'口才型選手'}[arr[0][0]];
}
function goodP(){ return S.traits.gifted?70:50; }

/* ================= UI ================= */
function logTarget(){ return _curYearBody||$('log'); }
function card(cls,title,html){ const d=document.createElement('div'); d.className='card '+cls;
  d.innerHTML=(title?`<h4>${title}</h4>`:'')+html; logTarget().appendChild(d); scrollBottom(); }
function divider(t){ const log=$('log'); const blocks=log.querySelectorAll('.yr-block');
  const prev=blocks[blocks.length-1];
  if(prev){ const h=prev.querySelector('.yr-head'); if(h&&prev.querySelector('.yr-body').children.length)h.classList.add('has-body'); }
  const pp=blocks[blocks.length-2]; if(pp)pp.classList.add('collapsed');
  const block=document.createElement('div'); block.className='yr-block';
  const head=document.createElement('div'); head.className='yr-head'; head.textContent=t;
  const body=document.createElement('div'); body.className='yr-body';
  head.onclick=()=>block.classList.toggle('collapsed');
  block.appendChild(head); block.appendChild(body); log.appendChild(block); _curYearBody=body;
  const nb=log.querySelectorAll('.yr-block');
  if(nb.length>MAX_YEARS){ for(let i=0;i<nb.length-MAX_YEARS;i++)nb[i].remove(); } }
function board(phase){
  $('bd-name').innerHTML=`${S.name}<small>${S.O.n}·${scholarType()}${S.traits.gifted?' ★':''}</small>`;
  $('bd-team').innerHTML=`<span style="color:var(--brass)">${stageLabel()}</span>`;
  $('bd-age').textContent=S.age; $('bd-year').textContent=S.year;
  $('bd-ovr').textContent=ovr(); $('bd-rep').textContent=S.rep;
  [0,1,2].forEach(i=>$('lp'+i).classList.toggle('on',i===phase));
  const mh=[];
  if(S.dep)mh.push('<span class="mh dep">憂鬱症</span>');
  if(S.traits.adhd)mh.push('<span class="mh adhd">ADHD</span>');
  if(S.traits.bipolar)mh.push(`<span class="mh bip">躁鬱症・${maniaPhase()===0?'躁期':'鬱期'}</span>`);
  if(S.rel)mh.push(`<span class="mh rel">${REL[S.rel.kind].n}</span>`);
  if(S.stress>0)mh.push(`<span class="mh str">壓力 ${S.stress}</span>`);
  $('bd-mh').innerHTML=mh.join(''); }
function stageLabel(){
  if(S.lostYear)return '休學療養';
  if(S.grade<3)return '高'+['一','二','三'][S.grade];
  return TIERS[S.tier].n+'（大'+['一','二','三','四'][clamp(S.grade-3,0,3)]+'）'; }
function actClear(){ const a=$('act'); a.innerHTML=''; a.classList.remove('collapsed');
  const t=$('act-toggle'); if(t)t.style.display='none'; }
function actSync(){ const a=$('act'),t=$('act-toggle'); if(!t)return;
  const has=a.innerHTML.trim()!==''; t.style.display=has?'block':'none';
  t.textContent=a.classList.contains('collapsed')?'⌃ 展開選項':'⌄ 收合選項'; }
function choose(title,opts){ actClear(); const a=$('act'); a.classList.remove('collapsed');
  if(title)a.innerHTML=`<div class="title">${title}</div>`;
  opts.forEach(o=>{ const b=document.createElement('button');
    b.className='btn'+(o.main?' main':'')+(o.warn?' warn':'');
    b.innerHTML=o.t+(o.s?`<small>${o.s}</small>`:'');
    if(o.dis){ b.disabled=true; }else{ b.onclick=()=>{ actClear(); o.f(); }; }
    a.appendChild(b); });
  actSync(); scrollBottom(); }
function allocUI(dice,label,done){
  actClear(); const a=$('act'); let idx=0, hist=[];
  a.innerHTML=`<div class="title">${label}</div><div id="al-top"></div><div id="al-rows"></div><div class="row2" id="al-btm"></div>`;
  const top=$('al-top'),rows=$('al-rows'),btm=$('al-btm');
  const locked=k=>S.lockPo&&k==='po';
  function render(){
    top.innerHTML='<div id="dice">'+dice.map((v,i)=>`<div class="die ${i<idx?'used':''} ${i===idx?'active':''} ${v===6?'six':''}">${v}</div>`).join('')+'</div>';
    rows.innerHTML='';
    KEYS.forEach(k=>{ const v=S.ab[k],cap=v>=AB_MAX,lk=locked(k);
      const r=document.createElement('div'); r.className='abrow'+(cap?' capped':'')+(lk?' locked':'');
      const pk=S.pot[k],cst=abCost(k),cr=S.carry[k]||0;
      r.innerHTML=`<span class="nm">${ABL[k]}${lk?' 🔒':''}</span><span class="bar"><i style="width:${Math.min(100,v/BAR*100)}%"></i><em style="left:${Math.min(100,pk/BAR*100)}%"></em></span>`+
        `<span class="val">${v}<small style="opacity:.5">/${pk}</small>${cst>1?`<span style="display:block;opacity:.5;font-size:10.5px;margin-top:-2px">${cr}/${cst}</span>`:''}</span>`;
      if(!cap&&!lk&&idx<dice.length)r.onclick=()=>{ const amt=dice[idx],pc=S.carry[k]||0;
        const got=addAb(k,amt); hist.push([k,got,pc]); idx++; render(); board(0); };
      rows.appendChild(r); });
    btm.innerHTML='';
    const u=document.createElement('button'); u.className='btn'; u.style.textAlign='center';
    u.textContent='↩ 復原'; u.disabled=!hist.length; u.style.opacity=hist.length?'1':'.35';
    if(hist.length)u.onclick=()=>{ const [k,got,pc]=hist.pop(); S.ab[k]-=got; S.carry[k]=pc; idx--; render(); board(0); };
    btm.appendChild(u);
    const allCap=KEYS.every(k=>S.ab[k]>=AB_MAX||locked(k));
    if(idx>=dice.length||allCap){ const c=document.createElement('button'); c.className='btn main';
      c.textContent=(idx<dice.length&&allCap)?'無處可加，捨棄剩餘骰子 ▸':'確認 ▸';
      c.onclick=()=>{ actClear(); done(); }; btm.appendChild(c); }
    actSync(); }
  render(); scrollBottom(); }

/* ================= 年度流程 ================= */
function nextStep(){ const f=stepQ.shift(); if(f)f(); }
function startYear(){ divider(`${S.year} 年 · ${S.age} 歲 · ${stageLabel()}`);
  if(S.lostYear){ lostYearCard(); return; }
  stepQ=[phaseTrain,phaseEvent,phaseLit,phaseLove,phaseMental]; nextStep(); }
function lostYearCard(){ board(1);
  card('info','休學療養',pick([
    '你在家裡住了一年。前三個月幾乎沒有出門，後來開始每天走到巷口的便利商店，再走回來。',
    '那一年你沒有讀任何一本學術著作。你養了一隻貓，學會做三道菜，體重回到高中的樣子。'])+
    `<div class="statline">同屆的人已經升上下一個年級了。<br>你錯過了一整年：沒有進修骰、沒有事件、沒有任何累積。</div>`);
  choose('',[{t:'▸ 一年後',main:true,f:()=>{ S.lostYear=false; endYear(); }}]); }
function endYear(){
  if(S.skipNext){ S.skipNext=false; S.age++; S.year++; S.lost++; S.lostYear=true; startYear(); return; }
  if(S.grade>=6){ finale(); return; }
  S.age++; S.year++; S.grade++; if(S.grade>=3)S.stage='U';
  if(S.tier==='intl'){ const d=bump('cf',3);
    card('good','盎格魯撒克遜的善意',`教授常說你的研究主題很有意思，説你很有學術天份。信心 <b class="up">+${d}</b>`); }
  startYear(); }
/* --- 年初：自主進修擲骰 --- */
function phaseTrain(){ board(0);
  let n = S.stage==='HS' ? (()=>{const r=R();return r<0.35?3:r<0.75?4:r<0.95?5:6;})() : TIERS[S.tier].dice();
  n += S.O.dice||0;
  const dice=[]; let newSix=0;
  for(let i=0;i<n;i++){ const v=S.traits.gifted?ri(4,6):ri(1,6); dice.push(v);
    if(v===6&&S.age<20&&!S.traits.gifted){S.six++;newSix++;} }
  let msg=`${S.stage==='HS'?'課餘自習':'學期進修'}擲出 <b class="hl">${n}</b> 顆骰${S.O.dice?`（${S.O.n}：+${S.O.dice} 顆）`:''}。`;
  if(newSix)msg+=` 出現「6」累計 <b class="hl">${S.six}/5</b> 次。`;
  card('','年初進修',msg);
  if(S.six>=5&&!S.traits.gifted&&S.age<20){
    const cands=KEYS.filter(k=>S.ab[k]<S.pot[k]-5); const bl=[];
    for(let i=0;i<2&&cands.length;i++){ const j=Math.floor(R()*cands.length); const k=cands.splice(j,1)[0];
      S.pot[k]=Math.min(AB_MAX,S.pot[k]+8); bump(k,4); bl.push(`${ABL[k]} <b class="up">+4</b>（上限 +8 → ${S.pot[k]}）`); }
    trait('gifted','天縱英才',`20 歲前五度擲出「6」。你不是特別努力的那種人，你是那種讓努力的人心裡難受的人——從今以後每顆骰<b class="hl">永久固定 4 點以上</b>，事件好結果機率提升至 <b class="hl">70%</b>。`+(bl.length?`<div class="statline">${bl.join('<br>')}</div>`:''));
    board(0); }
  choose('',[{t:`▸ 分配進修成果（${dice.length} 顆骰）`,main:true,
    f:()=>allocUI(dice,'分配進修成果（點能力套用｜40／55／70 以上成長遞減，超過潛力上限成本 ×3）',()=>nextStep())}]); }
/* --- 年中：事件 --- */
function phaseEvent(){ board(1);
  if(S.grade===0)e16();
  else if(S.grade===1)e17();
  else if(S.grade===2)e18();
  else eUni(); }
/* --- 年末：文學獎 → 精神健康 --- */
function phaseLit(){ board(2); litAward(); }
function phaseMental(){ board(2); mentalPhase(); }

/* ================= 16 歲：社團 ================= */
function e16(){
  choose('高一下・社團博覽會',[
    {t:'加入校刊社',s:'理論直覺 +4　口才 +2',f:()=>{
      card('good','校刊社',`你第一次讀到有人把你說不出口的東西寫成一整頁。<div class="statline">${bumps([['th',4],['sp',2]])}</div>`); nextStep(); }},
    {t:'加入辯論社',s:'口才 +5　政治 +2　信心 +1',f:()=>{
      card('good','辯論社',`你學會了一件事：立場可以抽籤決定。<div class="statline">${bumps([['sp',5],['po',2],['cf',1]])}</div>`); nextStep(); }},
    {t:'選進學生會',s:'政治 +4　行政 +4　※大學必定出現學生會長改選',f:()=>{
      S.hsGov=true;
      card('good','學生會',`你經手了人生第一份預算表，也第一次知道誰跟誰不合。<br><span style="color:var(--dim);font-size:12.5px">有些人是進去混一年就走，有些人從此再也離不開那間辦公室。</span><div class="statline">${bumps([['po',4],['ad',4]])}</div>`); nextStep(); }},
    {t:'哪都不去，補習班衝刺',s:'實證努力 +6　信心 −1',f:()=>{
      card('info','北車',`你的世界只剩下講義、模考、排名。有些能力就是在這種地方磨出來的。<div class="statline">${bumps([['em',6],['cf',-1]])}</div>`); nextStep(); }},
  ]); }

/* ================= 17 歲：人社營 ================= */
function e17(){
  const auto=!!S.O.camp;
  const sc=S.ab.th*0.4+S.ab.sp*0.3+S.ab.em*0.2+S.ab.po*0.1;
  const p=auto?100:clamp(25+(sc-30)*1.5,8,60);
  choose('高二暑假・全國人文社會科學營',[
    {t:'報名人社營',main:true,s:auto?`${S.O.n}：保障錄取 100%`:`預估錄取率 ${p.toFixed(0)}%（基準 25%，看理論直覺與口才）`,
     f:()=>{
      if(chance(p)){
        trait('camp','人社營',`兩週的營隊裡，你認識了未來二十年會一直在大學裡遇到的那些人。學術，從來不只是讀書。<div class="statline">${bumps([['po',10],['th',6]])}</div>`);
      }else{
        card('bad','未錄取',`備取名單上沒有你的名字。你反覆讀了三次那封信，然後把它刪掉。<div class="statline">${bumps([['cf',-2]])}</div>`);
      } nextStep(); }},
    {t:'不報名，把暑假留給自己',s:'什麼都不會發生',f:()=>{
      card('','平凡的暑假',`樹上開著杜鵑，白雲飄過窗前，你什麼都沒做。多年後你會想起這個暑假。`); nextStep(); }},
  ]); }

/* ================= 18 歲：篩選機制 ================= */
function e18(){
  const sc=schoolScore();
  const tier = sc>=42?'emp' : sc>=36?'top' : sc>=30?'nat' : 'priv';
  const det=`<div class="statline">實證努力 ${S.ab.em}×0.5　理論直覺 ${S.ab.th}×0.3<br>口才 ${S.ab.sp}×0.1　信心 ${S.ab.cf}×0.1<br>綜合分數 <b class="hl">${sc.toFixed(1)}</b>　（42 / 36 / 30 為分水嶺）</div>`;
  card('info','大學入學篩選',`三年的積累，被壓縮成一個數字。<br>${det}`);
  const go=t=>()=>{ enterUni(t); nextStep(); };
  const opts=[{t:`進入 ${TIERS[tier].n}`,main:true,s:TIERS[tier].d,f:go(tier)}];
  if(S.org==='cap')opts.push({t:'啟動跨國鈔能力',warn:true,
    s:'直接出國唸書｜骰數固定 5–6、每年信心 +3｜大學期間政治無法升級',f:go('intl')});
  choose('十八歲的分水嶺',opts); }
function enterUni(t){
  S.tier=t; S.stage='U';
  const T=TIERS[t]; const bl=[];
  Object.entries(T.pot).forEach(([k,v])=>{ S.pot[k]=Math.min(AB_MAX,S.pot[k]+v); bl.push(`${ABL[k]} 潛力上限 <b class="up">+${v}</b> → ${S.pot[k]}`); });
  if(t==='intl'){ S.lockPo=true; S.rep+=10; }
  if(t==='emp')S.rep+=15; if(t==='top')S.rep+=8; if(t==='nat')S.rep+=3;
  const txt={
   emp:'從此以後，你說的每一句話都會自動附贈一點可信度與責任。',
   top:'很好的學校，很好的系，只是每次自我介紹完，對方總會多問一句「那你怎麼沒去帝大」。',
   nat:'不上不下，剛剛好。你會花很多年才明白，這個位置其實最需要意志力。',
   priv:'系上一半的人在準備轉學考。你決定不轉，這個決定會跟著你很久。',
   intl:'你在異國的機場拖著兩個行李箱。台灣的排名遊戲，從此與你無關——你玩的是另一個。',
  }[t];
  card(t==='priv'?'bad':'gold',TIERS[t].n,txt+(bl.length?`<div class="statline">${bl.join('<br>')}</div>`:'')); }

/* ================= 文學獎（累積體制） ================= */
function litRate(){ return Math.min(85, 15 + S.litEntries*5 + S.litWins*10); }
function litAward(){
  const ok=S.ab.th>39, p=litRate();
  const bonus=S.litEntries*5+S.litWins*10;
  const detail = ok
    ? `得獎機率 <b>${p}%</b>${bonus?`（基礎 15%＋參賽 ${S.litEntries}次 +${S.litEntries*5}%＋得獎 ${S.litWins}次 +${S.litWins*10}%）`:'（基礎 15%）'}`
    : `<b>0%</b>　未達基礎門檻：理論直覺 40，目前 ${S.ab.th}`;
  choose(`${S.year} 年・文學獎徵稿`,[
    {t:'投稿', main:ok, s:`${detail}｜寫作佔掉時間：實證努力 −1｜落選：信心 −2`,
     f:()=>{ submitLit(); nextStep(); }},
    {t:'今年不投', s:'沒有任何變化，累積也不會增加', f:()=>{
      card('','文學獎徵稿',pick([
        '總感覺還不夠好，你把寫完的稿留在硬碟裡。',
        '想想其實也沒有什麼話要說。',
        '今年不投。理由你說得出十個，真正的那個不在裡面。',
        '你決定把這段時間留給該做的事。文學獎明年還會再辦。'])); nextStep(); }},
  ]); }
function submitLit(){
  bump('em',-1); const p=litRate(); S.litEntries++;
  const acc=()=>`<div class="statline" style="opacity:.75">累積：參賽 ${S.litEntries} 次・得獎 ${S.litWins} 次　→　明年得獎機率 <b class="hl">${litRate()}%</b></div>`;
  if(S.ab.th>39&&chance(p)){
    S.litWins++;
    if(S.ab.th>S.ab.em){
      S.rep+=20;
      if(!S.traits.prodigy){
        card('gold','全國文學獎',`頒獎典禮上，評審說你的文字「有一種不合年齡的透明」。你其實只是把痛苦寫得比較好看。<br><span class="hl">聲望 +20</span>`);
        trait('prodigy','早慧文青',`太早被肯定的人，會用一輩子來驗證那次肯定是不是誤會。（此屬性一生只取得一次）<div class="statline">${bumps([['th',2],['cf',6],['po',2]])}</div>`+acc());
      }else{
        card('gold','再一次全國大獎',`第 ${S.litWins} 座。評審裡有兩個人去年也在。他們記得你的名字，也記得你的句法。<br>得獎的人會越得越多，這件事沒有人會說破。<div class="statline">${bumps([['th',1],['cf',3],['po',3]])}</div><span class="hl">聲望 +20</span>`+acc());
      }
    }else{
      S.rep+=8;
      card('good','地方文學獎',`縣府大禮堂，獎金一萬五。你的文字很紮實，紮實到評審說「像一篇好的報告」。<div class="statline">${bumps([['th',-4],['cf',4],['em',4]])}</div><span class="hl">聲望 +8</span>`+acc());
    }
    return; }
  if(!(S.ab.th>39)){
    card('bad','初選未過',pick([
      '你知道自己還寫不出那種東西，但還是投了。信封寄出的那一刻你就後悔了。',
      '初選名單三十個人，沒有你。你安慰自己說評審看的是別的東西。',
      '你把稿子重讀一遍，這次讀出了問題在哪。太晚了。'])+
      `<div class="statline">${bumps([['cf',-2]])}</div>`+acc());
    return; }
  card('bad','落選',pick([
    '得獎名單公布了。你把自己的稿子重讀一遍，還是覺得寫得不錯。這就是最傷的地方。',
    '入圍名單上有你認識的人。你按了讚，然後關掉手機。',
    '評審講評裡有一句「有些作品野心過大而失焦」。你確定那說的是你。'])+
    `<div class="statline">${bumps([['cf',-2]])}</div>`+acc());
}

/* ================= 三階機率事件引擎 ================= */
function tierEvent(cfg,done){
  const sc=cfg.score();
  const calc=sp=>{
    let g=Math.round(clamp((sc-cfg.pivot)*cfg.slope+(cfg.gbase||22)+(sp?18:0),3,sp?80:66));
    let o=Math.round(clamp(38+(sc-cfg.pivot)*0.6+(sp?4:0),18,58));
    if(g+o>96)o=96-g;
    return [g,o,100-g-o]; };
  const a=calc(false), b=calc(true);
  const opts=[
    {t:cfg.t1||'認真準備',main:true,s:`大成功 <b>${a[0]}%</b>　普通 ${a[1]}%　失敗 ${a[2]}%`,f:()=>go(false)},
    {t:'全力衝刺',warn:true,s:`大成功 <b>${b[0]}%</b>　普通 ${b[1]}%　失敗 ${b[2]}%　｜代價：信心 −3、壓力 +1`,f:()=>go(true)},
  ];
  if(cfg.skip)opts.push({t:cfg.skip.t,s:cfg.skip.s,f:()=>{ cfg.skip.f(); done(); }});
  choose(cfg.title,opts);
  function go(sp){
    if(sp){ S.stress++;
      card('info','全力衝刺',pick([
        '你連續兩週睡在研究室的沙發上，靠咖啡因撐著。',

/* ================= 戀愛路線（大學階段） ================= */
const REL={
 stable:{n:'穩定交往',c:'good'},
 burn  :{n:'相愛相殺',c:'gold'},
 toxic :{n:'有毒的關係',c:'bad'},
};
const AGEQ={
 young:{n:'年幼',d:['小你兩屆的那個人','剛升大一、比你小三歲的那個人','系上直屬學弟妹']},
 peer :{n:'同儕',d:['同班的那個人','隔壁系同屆的那個人','讀書會上坐你對面的那個人']},
 old  :{n:'年長',d:['高你三屆、已經在唸碩班的那個人','系上的兼任助理，大你五歲','在研討會上認識、已經出社會的那個人']},
};
const FEELQ={
 like   :{n:'感興趣',d:'你確實被吸引——不是因為對方好看，是因為對方講話的方式讓你想一直聽下去。'},
 neutral:{n:'不討厭',d:'你對這個人沒有特別的感覺。不討厭，也不心動，只是剛好在同一個空間裡很久了。'},
 hate   :{n:'討厭',d:'你其實有點討厭這個人。討厭到你會在洗澡的時候反覆想起對方說過的話。'},
};
function meetPerson(){
  const age=pick(['young','peer','peer','peer','old','old']);
  const r=R()*100, feel=r<46?'like':r<92?'neutral':'hate';
  const theyMove=chance(40);
  return {age,feel,theyMove,desc:pick(AGEQ[age].d)}; }
function loveRate(p,mode){
  const base=S.ab.sp*0.5+S.ab.cf*0.3+S.ab.po*0.2;
  /* 對方已經主動了，答應幾乎不會失敗——真正的風險在後面 */
  if(mode==='passive')return Math.round(clamp(90+(base-30)/6,90,99));
  let v=(base-28)*1.8+32;
  if(S.org==='cap'||S.org==='art')v+=15;
  if(p.age==='old')v+=8; else if(p.age==='young')v-=5;
  if(p.feel==='like')v-=5; else if(p.feel==='neutral')v+=5; else v-=15;
  return Math.round(clamp(v,8,92)); }
function outcomeKind(p,mode,boost){
  const w=[];
  let stable=boost?60:40, burn=(boost?35:25), betray=(boost?6:10), toxic=(boost?8:16);
  if(p.feel!=='like')burn=0;
  if(p.age==='old')betray*=2.0;
  if(mode!=='passive')toxic=0;
  if(p.feel==='hate'){ stable*=0.6; betray*=1.5; toxic*=1.4; }
  w.push(['stable',stable],['burn',burn],['betray',betray],['toxic',toxic]);
  const tot=w.reduce((a,b)=>a+b[1],0); let r=R()*tot;
  for(const [k,v] of w){ r-=v; if(r<0)return k; }
  return 'stable'; }
function phaseLove(){
  if(S.grade<3){ nextStep(); return; }
  board(2);
  if(S.loveGuaranteed){ S.loveGuaranteed=false;
    const p=meetPerson(); p.feel=chance(70)?'like':'neutral';
    card('info','那個人',`${p.desc}。${FEELQ[p.feel].d}<div class="statline" style="opacity:.8">大一就決定要談戀愛：<b class="hl">直接進入關係，不會有失敗</b></div>`);
    settleRomance(p,'active',true); return; }

  encounter(); }
function encounter(){

    `<div class="statline" style="opacity:.85">${AGEQ[p.age].n}　${FEELQ[p.feel].n}　${p.theyMove?'對方主動':'沒有人先開口'}</div>`);

    s:`成功率 <b>${activeP}%</b>｜主動追求｜口才 50%・信心 30%・政治 20%`,f:()=>tryLove(p,'active',activeP)});
  opts.push({t:'不要，這學期很忙',s:'什麼都不會發生',f:()=>{
    card('',null,pick([
      '<p>你把那句話吞回去了。後來也沒有再拿出來過。</p>',

function tryLove(p,mode,rate){

  card('bad','沒有成功',pick([

function settleRomance(p,mode,boost){

    else card('info','你撐住了',`你哭了兩個晚上，第三天照常去上課。<br><span style="color:var(--dim)">信心夠厚的人不是不會痛，是痛完之後還站得起來。</span>`);

  if(kind==='toxic'){

    const d=bump('cf',-10);

      '<span style="color:var(--dim)">你在這段關係裡變得更聰明，也變得更不確定自己值不值得被喜歡。</span>'+

function finale(){
  board(2); divider(`${S.age} 歲 · 畢業`);
  const rows=KEYS.map(k=>{ const v=S.ab[k],pk=S.pot[k];
    return `<div class="abrow" style="cursor:default"><span class="nm">${ABL[k]}</span><span class="bar"><i style="width:${Math.min(100,v/BAR*100)}%"></i><em style="left:${Math.min(100,pk/BAR*100)}%"></em></span><span class="val">${v}<small style="opacity:.5">/${pk}</small></span></div>`; }).join('');
  const tl=S.traitList.length?S.traitList.map(t=>`<span class="trait">${t}</span>`).join(''):'<span style="color:var(--dim)">無</span>';
  card('gold',`${S.age} 歲・畢業`,
    `${S.O.n}出身的 <b class="hl">${S.name}</b>，從 ${TIERS[S.tier].n} 畢業${S.lost?`（休學 ${S.lost} 年，延畢）`:''}。`+
    `<div style="margin-top:8px">${rows}</div>`+
    `<div class="statline" style="margin-top:8px">學者類型　<b class="hl">${scholarType()}</b>　綜合 <b class="hl">${ovr()}</b>　聲望 <b class="hl">${S.rep}</b><br>文學獎　參賽 ${S.litEntries} 次・得獎 ${S.litWins} 次${S.mhList.length?`<br>精神科病史　${S.mhList.join('、')}${S.crisis?`｜住院 ${S.crisis} 次`:''}`:''}`+
    `${S.relLog.length?`<br>感情紀錄　${S.relLog.join('、')}${S.rel?`（${REL[S.rel.kind].n}中）`:''}`:'<br>感情紀錄　無'}${S.loveFails?`｜告白失敗 ${S.loveFails} 次`:''}</div>`+
    `<div style="margin-top:8px;font-size:12px;color:var(--dim);letter-spacing:.15em">已取得屬性</div><div>${tl}</div>`);
  gradChoice(); }

function msRate(){
  let sc=S.ab.th*0.3+S.ab.em*0.3+S.ab.po*0.2+S.ab.ad*0.1+S.rep*0.1;
  sc+= S.thesis==='great'?8 : S.thesis==='ok'?3 : S.thesis==='none'?-8 : 0;
  return {sc,p:Math.round(clamp((sc-32)*3.2+30,5,95))}; }
function phdOK(){ return S.ab.th>=55&&S.rep>=45&&(S.thesis==='great'||S.traits.nsc); }
function gradChoice(){
  const m=msRate(), ok=phdOK();
  choose('畢業去向',[
    {t:'推甄碩士班',main:true,s:`錄取率 <b>${m.p}%</b>（理論 30%／實證 30%／政治 20%／行政 10%＋聲望＋論文 ${S.thesis==='great'?'+8':S.thesis==='ok'?'+3':S.thesis==='none'?'−8':'0'}）｜落榜則進入職場`,
     f:()=>{ if(chance(m.p)){
        card('gold','推甄上了',`備審資料七十頁，面試十五分鐘。放榜那天你反覆重新整理了四十次頁面。<br>你還不知道，真正的篩選現在才開始。`);
        masterProgram(); }
      else{ card('bad','落榜',`正取六名、備取三名，沒有你。有人跟你說「再考一年就好」，但你算了一下家裡還能撐多久。<div class="statline">${bumps([['cf',-6]])}</div>`);
        career('碩士落榜'); } }},
    {t:'直攻博士班',s:ok?'預備研究生資格審查｜學術路線的極端解':'需要 理論直覺 ≥55、聲望 ≥45，且有優等論文或國科會計畫',dis:!ok,
     f:()=>{ card('gold','直攻博士',`老師說：「你要想清楚，這是十年的事。」你說你想清楚了。你當然沒有。`);
        phdChoice(true); }},
    {t:'投入職場',warn:true,s:'進入結局｜依 理論直覺・信心・政治・行政 判定',
     f:()=>career('主動求職')},
  ]); }
function toBeContinued(where){
  card('info','待續',`你進入了 ${where}。<br>指導教授的選擇、國科會計畫、期刊審查、研討會的政治、兼任講師的鐘點費、六年條款——<br><span style="color:var(--dim)">下一版本：23 → 45 歲。</span>`);
  choose('',[{t:'↺ 換一個人生',main:true,f:()=>restart()}]); }

/* 少年股神：直覺夠高、行政與實證都不能太高；躁鬱症大幅放寬門檻 */
function stockGod(){
  const bip=!!S.traits.bipolar;
  const thMin=bip?45:52, adMax=bip?50:42, emMax=bip?55:48;
  if(!(S.ab.th>=thMin&&S.ab.ad<=adMax&&S.ab.em<=emMax))return false;
  return chance(bip?85:50); }
/* ================= 碩士班 ================= */
function msThesisScore(){ return S.ab.th*0.35+S.ab.em*0.35+S.ab.ad*0.10+S.ab.cf*0.15+S.ab.po*0.05; }
function msDropRisk(){
  return Math.round(clamp(14+(30-S.ab.cf)*1.4+(S.dep?22:0)+(S.traits.adhd?8:0)+S.stress*3-(S.ab.ad-30)*0.6,4,72)); }
function masterProgram(){
  const drop=msDropRisk(), sc=msThesisScore();
  card('info','碩士班',
    `修業兩年，寫論文三年。你開始知道那些掛在研究室門口的名字是怎麼來的。<br>`+
    `<span style="color:var(--dim)">碩士班不篩選聰明，它篩選的是「能不能把一件沒有人在乎的事做完」。</span>`+
    `<div class="statline">退學風險 <b class="dn">${drop}%</b>　（信心・行政・精神狀態・壓力）<br>`+
    `論文分數 <b class="hl">${sc.toFixed(1)}</b>　理論 35%・實證 35%・信心 15%・行政 10%・政治 5%<br>`+
    `<span style="opacity:.7">58 以上為優秀論文，否則平庸</span></div>`);
  choose('',[{t:'▸ 三年後',main:true,f:()=>{
    if(chance(drop))msDropout();
    else if(sc>=58)msGreat();
    else msMediocre(); }}]); }
function msDropout(){
  const a=bump('ad',4), c=bump('cf',-16);
  card('bad','碩士退學',
    `第三年你已經很久沒有進研究室了。指導教授最後一次寄信給你，你連開都沒有開。<br>`+
    `辦退學的手續比想像中簡單，蓋七個章，四十分鐘。<br>`+
    `<span style="color:var(--dim)">你把那些讀書會的筆記整箱丟掉的時候，才真的哭出來。</span>`+
    `<div class="statline">行政 <b class="up">+${a}</b>（你至少學會了怎麼跑流程）　信心 <b class="dn">${c}</b></div>`);
  choose('',[{t:'▸ 進入職場',main:true,f:()=>career('碩士退學')}]); }
function msMediocre(){
  card('info','平庸論文',
    `你交出去了。口試委員問的問題都很客氣，客氣到你知道他們沒有很認真讀。<br>`+
    `<span style="color:var(--dim)">你曾經幻想能夠創造些什麼屬於你的東西，但現在的你只求順利畢業。</span>`+
    `<div class="statline">${bumps([['em',6],['ad',6]])}</div>`);
  choose('接下來呢',[
    {t:'進入職場',main:true,s:'依 理論直覺・信心・政治・行政 判定',f:()=>career('碩士畢業')},
    {t:'硬考本土博士',warn:true,
     s:'政治 +7　行政 +5　實證 +3｜碩論平庸：教職競爭力 −10｜可能唸完仍然沒有專任',
     f:()=>{ S.weakPhd=true;
       card('info','還是唸下去了',
         `沒有人特別鼓勵你唸，但也沒有人阻止你。你考上了，因為那年報名的人只比錄取名額多兩個。<br>`+
         `<span style="color:var(--dim)">「先唸再說，反正外面也不好找。」這句話你會在往後十年裡聽很多人說，包括你自己。</span>`+
         `<div class="statline">${bumps([['po',7],['ad',5],['em',3]])}</div>`);
       academicCareer('local'); }},
  ]); }
function msGreat(){
  card('gold','優秀論文',
    `口試那天有兩個委員為了你的第三章的立論吵了起來，而你發現自己有能力回答他們兩個人。<br>`+
    `會後有人問你要不要把它改寫成專書。<br>`+
    `<span style="color:var(--dim)">那是你第一次感覺到，自己說的話可能有一點重量。</span>`+
    `<div class="statline">${bumps([['cf',8],['th',6],['em',5],['po',5]])}</div>`);
  S.rep+=20; phdChoice(false); }
function phdChoice(direct){
  const ok=S.ab.th>=50;
  choose('接下來呢',[
    {t:'你受夠了',warn:true,s:'離開學術｜進入職場判定',f:()=>career(direct?'放棄直攻博士':'碩士畢業・離開學術')},
    {t:'海外博士',main:true,s:'理論 +8　口才 +6　信心 +4　政治 −6｜教職競爭力 +8'+(ok?'':'｜理論直覺偏低，風險高'),
     f:()=>{ card('gold','海外博士',
        `你在異國的圖書館裡度過了六年。第一年你連點餐都會緊張，第四年你在系上的 colloquium 主講。<br>`+
        `<span style="color:var(--dim)">回國那天你發現同屆的人已經在系上有位子了，而你連誰是誰都還要重新認一次。</span>`+
        `<div class="statline">${bumps([['th',8],['sp',6],['cf',4],['po',-6]])}</div>`);
        academicCareer('overseas'); }},
    {t:'本土博士',s:'政治 +9　行政 +6　實證 +4　理論 +2｜留在同一個系統裡',
     f:()=>{ card('gold','本土博士',
        `你留在原本的系統裡。同一批老師、同一間研究室、同一組人脈，只是身分從學生變成了「小老師」。<br>`+
        `<span style="color:var(--dim)">你很早就知道誰跟誰不合、哪個委員會該爭取。這些東西在國外唸書的人要花十年才學得會。</span>`+
        `<div class="statline">${bumps([['po',9],['ad',6],['em',4],['th',2]])}</div>`);
        academicCareer('local'); }},
  ]); }

/* ================= 三十年學術職涯 ================= */
function academicCareer(kind){
  const a=S.ab, YEARS=30;
  /* 時間推進：博班年數 + 三十年職涯 */
  const dy=kind==='overseas'?9:8, degreeYear=S.year+dy;
  S.year=degreeYear+YEARS; S.age+=dy+YEARS;
  /* --- 教職 --- */
  const tierBonus={emp:6,top:3,nat:1,priv:0,intl:5}[S.tier]||0;
  /* 就業市場：那年有沒有缺、缺在不在你的領域，這件事不是你能控制的 */
  const luck=ri(-9,9);
  const post=a.th*0.30+a.po*0.25+a.em*0.20+a.ad*0.10+Math.min(S.rep,100)*0.10
    +(kind==='overseas'?8:0)+tierBonus-(S.weakPhd?14:0)+luck;
  const POSTS=[[78,'帝大霸權 教職'],[66,'頂大系統 教職'],[54,'國立大學 教職'],[42,'私校聯盟 教職'],[-99,'沒有專任教職']];
  const job=POSTS.find(x=>post>=x[0])[1];
  const tenured=job!=='沒有專任教職';
  /* --- 科技部計畫：30 次申請 --- */
  const gp=clamp((a.em*0.35+a.po*0.30+a.ad*0.25+a.th*0.10-24)*1.7,6,86)*(tenured?1:0.45);
  let grants=0; for(let i=0;i<YEARS;i++)if(chance(gp))grants++;
  /* 計畫是研究的燃料：決定產出係數，也小幅提升品質 */
  const fund=grants/YEARS, mult=0.58+0.72*fund;
  /* --- 產出總量 --- */
  const nPapers=Math.max(1,Math.round((4+a.em*0.22+a.po*0.08+a.ad*0.04)*mult*(tenured?1:0.5)));
  const nBooks =Math.max(0,Math.round((0.6+a.th*0.032+a.em*0.018)*mult*(tenured?1:0.5)));
  /* --- 分級規則 --- */
  const landmarkOK = a.th>=80&&a.po<=60;
  const influOK    = (a.th>=70&&a.em>=60)||a.po>=70;
  const pInflu = influOK?clamp((a.th+a.em+a.po*0.5)/4-18+fund*7,10,52):0;
  const pIgnor = a.po<60?clamp((60-a.po)*0.75,5,38):0;
  let landmarkLeft=0;
  if(landmarkOK)for(let i=0;i<3;i++)if(chance(50))landmarkLeft++;
  function grade(n,landP){
    const r={land:0,infl:0,mid:0,ign:0};
    for(let i=0;i<n;i++){
      if(landmarkLeft>0&&chance(landP)){ r.land++; landmarkLeft--; continue; }
      if(chance(pInflu)){ r.infl++; continue; }
      if(chance(pIgnor)){ r.ign++; continue; }
      r.mid++; }
    return r; }
  const B=grade(nBooks,70), P=grade(nPapers,16);
  /* 劃時代名額沒用完的，補在專書上（經典多半是書） */
  while(landmarkLeft>0&&B.mid>0){ B.mid--; B.land++; landmarkLeft--; }
  /* 聲望特例：名氣本身就會讓書被讀——最多兩部專書 */
  let repSlots=0;
  if(S.rep>=75&&chance(75))repSlots++;
  if(S.rep>=110&&chance(60))repSlots++;
  let repUp=0;
  for(let i=0;i<repSlots;i++){
    if(B.mid>0){ B.mid--; B.infl++; repUp++; }
    else if(B.ign>0){ B.ign--; B.infl++; repUp++; } }
  /* --- 優良教師 --- */
  const tp=clamp((a.sp*0.6+a.cf*0.4-38)*1.6,2,48)*(tenured?1:0.6);
  let teach=0; for(let i=0;i<YEARS;i++)if(chance(tp))teach++;
  /* --- 系主任 --- */
  let chair=0;
  if(tenured){ const cp=clamp((a.ad*0.5+a.po*0.5-38)*3.0,0,92);
    if(chance(cp)){ chair=3; if(chance(cp*0.55))chair+=3; if(chance(cp*0.25))chair+=3; } }
  /* --- 呈現 --- */
  const row=(l,v,c)=>`<div style="display:flex;justify-content:space-between;gap:10px;padding:2px 0"><span style="color:${c||'var(--paper)'}">${l}</span><b style="font-family:var(--mono);color:${c||'var(--brass)'}">${v}</b></div>`;
  const kindN=kind==='overseas'?'海外博士':'本土博士';
  card(tenured?'gold':'bad','三十年後',
    `${kindN}。你在 ${degreeYear} 年前後拿到學位，然後是三十年。<br>`+
    `<span style="color:var(--dim)">${tenured?'你有一間自己的研究室，門口貼著你的名字和 office hour。':'你沒有拿到專任教職。三十年來你在四所學校之間跑鐘點，每學期重新簽一次約。'}</span>`+
    `<div class="statline" style="line-height:1.9">`+
    row('教職',job,tenured?'var(--brass)':'var(--bad)')+
    row('　就業市場運氣',(luck>=0?'+':'')+luck,'var(--dim)')+
    row('科技部計畫',`${grants} / ${YEARS} 件`)+
    row('　產出係數',`×${mult.toFixed(2)}`,'var(--dim)')+
    `<div style="margin-top:6px;color:var(--dim);font-size:11.5px;letter-spacing:.15em">學術專書 ${nBooks} 本</div>`+
    row('　劃時代經典',B.land+' 本',B.land?'var(--brass)':'var(--dim)')+
    row('　有影響力',B.infl+' 本')+
    (repUp?row('　　其中靠聲望',repUp+' 本','var(--dim)'):'')+
    row('　平庸無奇',B.mid+' 本','var(--dim)')+
    row('　乏人問津',B.ign+' 本','var(--dim)')+
    `<div style="margin-top:6px;color:var(--dim);font-size:11.5px;letter-spacing:.15em">期刊論文 ${nPapers} 篇</div>`+
    row('　劃時代經典',P.land+' 篇',P.land?'var(--brass)':'var(--dim)')+
    row('　有影響力',P.infl+' 篇')+
    row('　平庸無奇',P.mid+' 篇','var(--dim)')+
    row('　乏人問津',P.ign+' 篇','var(--dim)')+
    `<div style="margin-top:6px"></div>`+
    row('優良教師',teach+' 次')+
    row('系主任',chair?chair+' 年':'沒有當過')+
    `</div>`);
  board(2);
  academicCoda(kind,job,tenured,B,P,grants,teach,chair,mult,repUp,nBooks,nPapers,luck); }

function academicCoda(kind,job,tenured,B,P,grants,teach,chair,mult,repUp,nBooks,nPapers,luck){
  const land=B.land+P.land, infl=B.infl+P.infl, ign=B.ign+P.ign;
  let title,body;
  if(land>=3){ title='學派';
    body='你的名字變成了一種形容詞。研究生在報告裡寫「某某式的讀法」，指的是你。<br>'+
      '你活著看到自己的東西進了教科書——這件事發生的時候，你正在為了一份核銷單跟會計室吵架。'; }
  else if(land>=1){ title='那一本書';
    body='你寫過一本大家都會引用的書。之後的二十年，每一次自我介紹都會被提到它。<br>'+
      '<span style="color:var(--dim)">你後來寫的東西沒有一本超過它。你不確定那是因為你退步了，還是因為那本書把你用完了。</span>'; }
  else if(chair>=6){ title='行政人生';
    body='你把最好的十年給了會議、評鑑、招生和系務。系上因為你而運作良好。<br>'+
      '<span style="color:var(--dim)">退休演講上，同事說你是系上的支柱。沒有人提到你的研究。</span>'; }
  else if(infl>=6){ title='穩健的一生';
    body='你不是天才，但你三十年沒有停過。你的論文被引用、被反駁、被繼續寫下去。<br>學術大部分就是由你這種人撐起來的。'; }
  else if(!tenured){ title='流浪';
    body='你到現在還在教通識。學生很喜歡你，每學期的評鑑都很高分。<br>'+
      '<span style="color:var(--dim)">你六十歲那年還在投履歷。你已經不太記得當初想研究的是什麼問題了。</span>'; }
  else if(ign>=P.mid+B.mid){ title='沒有人讀';
    body='你發表了很多東西。你可以確定的是，其中大部分沒有第二個人從頭讀到尾。<br>'+
      '<span style="color:var(--dim)">但升等需要，評鑑需要，系上的排名需要。所以你繼續寫。</span>'; }
  else { title='一份工作';
    body='你按時上下班，論文按時產出，課按時教完。三十年就這樣過去了。<br>'+
      '<span style="color:var(--dim)">你偶爾會想起大學那年在總圖地下室啃完那本書的自己。那個人以為前面有別的東西。</span>'; }
  const extra = S.traits.bipolar?'<br><br><span style="color:var(--dim)">你的產出一直是一陣一陣的。系上的人習慣了，說你是「有靈感型的」。</span>'
    : S.dep?'<br><br><span style="color:var(--dim)">那件事你從來沒有真的處理過。它跟著你進了研究室，也跟著你退休。</span>'
    : S.traits.adhd?'<br><br><span style="color:var(--dim)">你到六十歲還是會在系務會議上走神。你已經不再為此感到抱歉了。</span>':'';
  card(land>=1?'gold':tenured?'info':'bad','結局・'+title,body+extra+
    `<div class="statline">${KEYS.map(k=>`${ABL[k]} <b>${S.ab[k]}</b>`).join('　')}<br>`+
    `${S.O.n}出身｜${TIERS[S.tier].n}畢業｜${kind==='overseas'?'海外':'本土'}博士｜${job}${S.mhList.length?`｜${S.mhList.join('、')}`:''}</div>`);
  endGame(land>=1?'gold':tenured?'good':'bad',title,
    [`${kind==='overseas'?'海外':'本土'}博士・三十年學術生涯`,job],[
    ['§','職位與資源'],
    ['教職',job],
    ['科技部計畫',grants+' / 30 件'],
    ['就業市場運氣',(luck>=0?'+':'')+luck,'#948da6'],
    ['產出係數','×'+mult.toFixed(2),'#948da6'],
    ['§','學術專書　'+nBooks+' 本'],
    ['劃時代經典',B.land+' 本',B.land?'#d4a24c':'#948da6'],
    ['有影響力',B.infl+' 本'],

function career(reason){

      ad:['派遣行政','你在一間公司做約聘行政，一年一簽。<br>工作內容不難，你做得很好。沒有人問過你大學讀什麼。']},

  /* --- 專屬結局判定，優先於一般分帶 --- */

      rule='資本之家專屬｜行政或實證努力 ≥45';
    }else if(S.ab.th>=50){

        `你去了三十幾個國家，在京都住過一季，在柏林和巴黎租過半年的房子，在南美洲學會了衝浪。<br>`+
        `你出生就註定是來體驗世界的，這句話從別人嘴裡說出來像諷刺，從你的人生看起來像事實。<br>`+
        `<span style="color:var(--dim)">你偶爾把想到的東西寫成長文放在網誌上，寫得其實很好。<br>`+

    }else{
      band=0; rule='資本之家：不會落到那四種結局以外';

  }else if(stockGod()){
    const bip=!!S.traits.bipolar;

      `大四下你開了證券戶，本來只是想搞懂那些新聞在講什麼。<br>`+
      `結果你發現人社訓練最值錢的地方，是看穿一個敘事怎麼被製造出來、又怎麼被一群人集體相信——`+
      `這件事在金融市場上，比在期刊上值錢得多。<br>`+
      `期貨、選擇權、當沖。有一年你賺了同學五年的薪水，也有一個月賠掉一台車。<br>`+
      (bip?`<span style="color:var(--dim)">躁期的時候你覺得自己看穿了整個系統，重押、加碼、不睡覺。<br>`+
           `鬱期的時候你不敢打開 APP，帳號密碼放在抽屜最裡面。<br>`+
           `你分不清那些勝利是判斷力還是病——你也不太想分清楚。</span>`
          :`<span style="color:var(--dim)">你不跟人講你在做什麼。同學問起就說「接案」。<br>`+

    rule='少年股神｜理論直覺高・行政與實證皆不高'+(bip?'（躁鬱症門檻放寬）':'');
  }
  const [title,body]=special||E[band][dom];
  const rows=KEYS.map(k=>`${ABL[k]} <b>${S.ab[k]}</b>`).join('　');
  card(special||band===0?'gold':band===1?'good':'bad','結局・'+title,
    `${body}<div class="statline">${reason}｜職涯判定分數 <b class="hl">${sc.toFixed(1)}</b>${rule?`<br><span class="hl">${rule}</span>`:''}<br>理論直覺 ${S.ab.th}×0.35　信心 ${S.ab.cf}×0.30　政治 ${S.ab.po}×0.20　行政 ${S.ab.ad}×0.15<br>${rows}</div>`);
  const coda = special&&title==='少年股神' ? '你偶爾會夢見大學那間研究室。醒來之後開盤了。'
    : special&&title==='繼承家業' ? '同學會上大家問你在做什麼，你說「家裡的事」。話題就停在那裡了。'
    : special&&title==='享受人生' ? '有人說你浪費了那顆腦袋。你想反駁，但你想不出要拿它去換什麼。'
    : S.traits.prodigy&&band===2 ? '十六歲那年你得過全國文學獎。這件事現在沒有人記得，包括你自己也很少想起。'
    : S.dep ? '你沒有去看醫生。那件事還在，只是你學會了不去碰它。'
    : S.traits.adhd ? '你到現在還是會在會議中途走神。但你已經知道那不是你的錯了。'
    : band===0 ? '你偶爾會夢見系學會的燈。醒來之後照常上班。'
    : '學術這條路你沒有走。多年後你會發現，走了的人也未必比較快樂。';
  card('info','後來',coda);
  endGame(special||band===0?'gold':band===1?'good':'bad',title,[reason,rule||`職涯判定分數 ${sc.toFixed(1)}`],[
    ['§','職涯判定'],
    ['判定分數',sc.toFixed(1)],['出身',S.O.n],['學校',TIERS[S.tier].n],
    ['綜合評價',ovr()],['聲望',S.rep],
    ['§','大學紀錄'],
    ['文學獎',`參賽 ${S.litEntries}・得獎 ${S.litWins}`],
    ['畢業論文',{great:'優等',ok:'完成',bad:'低空飛過',none:'沒有寫'}[S.thesis]||'—'],
    ['精神科病史',S.mhList.join('、')||'無'],
    ['取得屬性',S.traitList.length?S.traitList.join('・'):'無'],
    ...loveRows(),
  ]); }

function loveRows(){
  const PINK='#dd8fa4', RED='#dd7264', GREY='#948da6';
  if(!S.relLog.length&&!S.loveFails)return [['§','大學情史'],['沒有談過戀愛','—',GREY]];
  const rows=[['§','大學情史']];
  S.relLog.forEach(r=>{ const m=r.match(/^(.+?)（(.+)）$/);
    rows.push([m?m[2]:r, m?m[1]:'', m&&/背叛|有毒/.test(m[1])?RED:PINK]); });
  if(S.loveFails)rows.push(['告白失敗',S.loveFails+' 次',GREY]);
  rows.push(['最後狀態',S.rel?REL[S.rel.kind].n+'中':'單身',GREY]);
  return rows; }
function endGame(tone,title,subs,rows){
  S.endInfo={tone,title,subs,rows};
  const sh=document.createElement('div'); sh.className='card';
  sh.innerHTML=`<h4>分享這段人生</h4>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn main" id="sh-img" style="flex:1;margin-top:0">📸 產生結算圖</button>
      <button class="btn" id="sh-url" style="flex:1;margin-top:0">🔗 複製重播連結</button>
    </div><div id="sh-out" style="margin-top:8px"></div>`;
  logTarget().appendChild(sh);
  sh.querySelector('#sh-img').onclick=e=>{ e.target.textContent='繪製中…'; e.target.disabled=true;
    shareImage(sh.querySelector('#sh-out'),()=>{ e.target.textContent='📸 產生結算圖'; e.target.disabled=false; }); };
  sh.querySelector('#sh-url').onclick=e=>{
    const url=replayURL();
    const ok=()=>{ e.target.textContent='✅ 已複製'; setTimeout(()=>e.target.textContent='🔗 複製重播連結',1600); };
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(url).then(ok,()=>prompt('手動複製連結：',url));
    else prompt('手動複製連結：',url); };
  choose('',[
    {t:'↺ 開啟新的人生（新種子）',main:true,f:()=>{ location.href=base()+'?y='+S.startYear; }},
    {t:'用同一個種子重來',s:'seed: '+SEED,f:()=>{ location.href=replayURL(); }}]);
  scrollBottom(); }
function base(){ return location.href.split('?')[0].split('#')[0]; }
function replayURL(){ return base()+'?seed='+encodeURIComponent(SEED)+'&y='+S.startYear; }

async function shareImage(out,done){
  try{ if(document.fonts&&document.fonts.ready)await document.fonts.ready; }catch(e){}
  let url,fileName;
  try{ url=drawSummary(); }catch(err){ out.innerHTML=`<div class="statline">結算圖產生失敗：${err.message}</div>`; done&&done(); return; }
  fileName=`${S.name}_人文社科學生模擬器.png`;
  out.innerHTML=`<img src="${url}" style="width:100%;border-radius:8px;display:block" alt="結算圖">
    <div style="display:flex;gap:8px;margin-top:8px">
      <button class="btn main" id="sh-save" style="flex:1;margin-top:0">💾 儲存 / 分享圖片</button>
      <button class="btn" id="sh-dl" style="flex:1;margin-top:0">下載到裝置</button>
    </div>
    <div class="statline" style="margin-top:6px">若按鈕無效，長按上方圖片也可儲存</div>`;
  const dl=()=>{ const a=document.createElement('a'); a.href=url; a.download=fileName;
    document.body.appendChild(a); a.click(); a.remove(); };
  out.querySelector('#sh-dl').onclick=dl;
  out.querySelector('#sh-save').onclick=async()=>{
    try{
      const blob=await (await fetch(url)).blob();
      const file=new File([blob],fileName,{type:'image/png'});
      if(navigator.canShare&&navigator.canShare({files:[file]})){
        await navigator.share({files:[file],title:'人文社科學生模擬器',text:`${S.name}｜${S.endInfo.title}`});
        return; }
    }catch(e){ if(e&&e.name==='AbortError')return; }
    dl(); };
  done&&done(); scrollBottom(); }

function drawSummary(){
  const E=S.endInfo, rows=E.rows||[], subs=E.subs||[];
  const W=900, PAD=52, DPR=2;
  const H = 712 + subs.length*34 + rows.reduce((h,r)=>h+(r[0]==='§'?44:36),0);
  const cv=document.createElement('canvas'); cv.width=W*DPR; cv.height=H*DPR;
  const c=cv.getContext('2d'); c.scale(DPR,DPR);
  const SANS='"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif';
  const SERIF='"Noto Serif TC","Songti TC",serif';
  const MONO='"IBM Plex Mono",Menlo,monospace';
  const PAPER='#e9e2d1', DIM='#948da6', BRASS='#d4a24c', SEAL='#c2452f', EDGE='#37334a';
  /* 底 */
  c.fillStyle='#141319'; c.fillRect(0,0,W,H);
  const g=c.createLinearGradient(0,0,0,320); g.addColorStop(0,'#2a2438'); g.addColorStop(1,'#14131900');
  c.fillStyle=g; c.fillRect(0,0,W,320);
  const T=(t,x,y,size,color,font,weight,align)=>{ c.font=`${weight||400} ${size}px ${font||SANS}`;
    c.fillStyle=color||PAPER; c.textAlign=align||'left'; c.textBaseline='alphabetic'; c.fillText(t,x,y); };
  const fitRight=(t,x,y2,maxW,color)=>{
    let size=18; c.textAlign='right'; c.fillStyle=color;
    for(;size>=12;size--){ c.font=`700 ${size}px ${MONO}`; if(c.measureText(t).width<=maxW)break; }
    let str=t;
    if(c.measureText(str).width>maxW){ while(str.length>1&&c.measureText(str+'…').width>maxW)str=str.slice(0,-1); str+='…'; }
    c.fillText(str,x,y2); };
  let y=64;
  /* 印章 */
  c.strokeStyle=SEAL; c.lineWidth=3; c.strokeRect(PAD,y-4,64,64);
  T('人文',PAD+10,y+22,20,SEAL,SERIF,700); T('社科',PAD+10,y+46,20,SEAL,SERIF,700);
  T('人文社科學生模擬器',PAD+84,y+22,26,PAPER,SERIF,700);
  T(`${S.startYear} → ${S.year}　${S.age} 歲`,PAD+84,y+50,17,DIM,MONO,500);
  y+=104;
  c.strokeStyle=EDGE; c.lineWidth=1; c.beginPath(); c.moveTo(PAD,y); c.lineTo(W-PAD,y); c.stroke();
  y+=48;
  /* 姓名與出身 */
  T(S.name,PAD,y,34,PAPER,SERIF,900);
  const meta=`${S.O.n}　${S.tier?TIERS[S.tier].n:'未升學'}${S.traitList.length?'　'+scholarType():''}`;
  T(meta,PAD,y+30,17,DIM,SANS,500);
  y+=76;
  /* 結局 */
  const tc=E.tone==='bad'?'#dd7264':E.tone==='gold'?BRASS:'#8fc79f';
  c.fillStyle=tc; c.fillRect(PAD,y-22,6,30);
  T(E.title,PAD+18,y,30,tc,SERIF,900);
  y+=26;
  subs.forEach(t=>{ y+=34; T(t,PAD,y,17,DIM,SANS,400); });
  y+=42;
  /* 能力 */
  T('能力值',PAD,y,14,DIM,SANS,700); y+=22;
  KEYS.forEach(k=>{
    const v=S.ab[k],pk=S.pot[k],bx=PAD+108,bw=W-PAD*2-108-92;
    T(ABL[k],PAD,y+12,17,PAPER,SANS,700);
    c.fillStyle='#100f15'; c.fillRect(bx,y+2,bw,12);
    const gg=c.createLinearGradient(bx,0,bx+bw,0); gg.addColorStop(0,'#544470'); gg.addColorStop(1,BRASS);
    c.fillStyle=gg; c.fillRect(bx,y+2,bw*Math.min(1,v/AB_MAX),12);
    c.fillStyle='#d4a24c88'; c.fillRect(bx+bw*Math.min(1,pk/AB_MAX)-1,y,2,16);
    T(String(v),W-PAD,y+13,19,BRASS,MONO,700,'right');
    T('/'+pk,W-PAD-46,y+13,13,DIM,MONO,500,'right');
    y+=42; });
  y+=4;
  /* 明細 */
  rows.forEach(r=>{
    if(r[0]==='§'){ y+=30; T(r[1],PAD,y,13,DIM,SANS,700); y+=14;
      c.strokeStyle=EDGE; c.beginPath(); c.moveTo(PAD,y-6); c.lineTo(W-PAD,y-6); c.stroke(); return; }
    y+=36; T(r[0],PAD,y,17,r[2]||PAPER,SANS,400);
    c.font=`400 17px ${SANS}`; const lw=c.measureText(r[0]).width;
    fitRight(String(r[1]),W-PAD,y,W-PAD*2-lw-24,r[2]||BRASS); });
  /* 頁尾 */
  y=H-40;
  c.strokeStyle=EDGE; c.beginPath(); c.moveTo(PAD,y-26); c.lineTo(W-PAD,y-26); c.stroke();
  T('seed '+SEED,PAD,y,14,DIM,MONO,500);
  T('人文社科學生模擬器',W-PAD,y,14,DIM,SANS,500,'right');
  return cv.toDataURL('image/png'); }

  if(!open){ selOrg=null; g.querySelectorAll('button').forEach(x=>x.classList.remove('on')); } };
$('seed-show').value=SEED;
$('seed-re').onclick=e=>{e.preventDefault();SEED=Math.random().toString(36).slice(2,10);$('seed-show').value=SEED;};
function askYes(msg){ try{ return confirm(msg); }catch(e){ return true; } }
function restart(){ try{ location.reload(); }catch(e){ location.href=location.href; } }
$('btn-restart').onclick=()=>{ if(askYes('重新開始一段人生？'))restart(); };
$('btn-start').onclick=()=>{ try{
  const nm=$('in-name').value.trim()||'賴祥德';
  const sv=$('seed-show').value.trim(); if(sv)SEED=sv;
  const qy=new URLSearchParams(location.search).get('y');
  if(qy)$('in-year').value=clamp(parseInt(qy,10)||NOW_YEAR,2010,NOW_YEAR);
  /* file:// 與部分內嵌檢視器會讓 replaceState 拋 SecurityError，不能讓它擋住開場 */
  try{ history.replaceState(null,'','?seed='+encodeURIComponent(SEED)+'&y='+$('in-year').value); }catch(e){}
  seedInit(SEED);
  const org=selOrg||drawOrigin();
  const yr=clamp(parseInt($('in-year').value,10)||NOW_YEAR,2010,NOW_YEAR);
  S=newState(nm,org,yr);
  $('start').style.display='none'; $('board').style.display=''; $('act').style.display='';
  const rows=KEYS.map(k=>`${ABL[k]} <b class="hl">${S.ab[k]}</b><span style="opacity:.5">／上限 ${S.pot[k]}</span>`).join('　');
  card('info','天賦判定',`${S.year} 年，十六歲的 <b class="hl">${S.name}</b>。<br>命運擲出了 <b class="hl">${S.O.n}</b>（${S.O.w}%）——${S.O.d}`+
    `<div class="statline">${rows}</div>`+
    `<p style="color:var(--dim);font-size:12px;margin-top:6px">提示：20 歲前累積擲出 5 次「6」可覺醒隱藏屬性。</p>`);
  startYear();
  }catch(err){ showFatal(err); } };
</script>
</body>
</html>
